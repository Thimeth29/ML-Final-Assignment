# Minimal Airflow docker compose for local development (template)
# Based on official Apache Airflow image.
# NOTE: You may need to adjust volumes/paths depending on your Windows setup.

version: "3"
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: "my_super_secret_key_12345"
      PIP_ADDITIONAL_REQUIREMENTS: "dvc[s3] pandas scikit-learn joblib matplotlib mlflow xgboost seaborn"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username airflow --password airflow --firstname Airflow --lastname Admin --role Admin --email airflow@example.com || true &&
      airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.9.3
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: "my_super_secret_key_12345"
      PIP_ADDITIONAL_REQUIREMENTS: "dvc[s3] pandas scikit-learn joblib matplotlib mlflow xgboost seaborn"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    command: >
      bash -c "
      airflow db init &&
      airflow scheduler
      "
